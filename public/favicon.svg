<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1a1c"/>
      <stop offset="60%" stop-color="#0f0f10"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
    <linearGradient id="bladeGrad" x1="0" y1="-92" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="55%" stop-color="#dcd6c8"/>
      <stop offset="100%" stop-color="#a59f90"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </radialGradient>
    <clipPath id="ringClip"><circle cx="0" cy="0" r="92"/></clipPath>
    <g id="blade"><polygon points="0,-92 78,-46 0,0"/></g>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>
  <g transform="translate(512 512) scale(3.6)">
    <circle cx="0" cy="0" r="98" fill="none" stroke="#efece5" stroke-width="0.6" opacity="0.35"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#efece5" stroke-width="1.6"/>
    <g clip-path="url(#ringClip)">
      <g fill="url(#bladeGrad)" stroke="#efece5" stroke-width="0.4">
        <use href="#blade"/>
        <g transform="rotate(45)"><use href="#blade"/></g>
        <g transform="rotate(90)"><use href="#blade"/></g>
        <g transform="rotate(135)"><use href="#blade"/></g>
        <g transform="rotate(180)"><use href="#blade"/></g>
        <g transform="rotate(225)"><use href="#blade"/></g>
        <g transform="rotate(270)"><use href="#blade"/></g>
        <g transform="rotate(315)"><use href="#blade"/></g>
      </g>
      <g stroke="#0b0b0c" stroke-width="0.7" opacity="0.45">
        <line x1="0" y1="0" x2="0" y2="-92"/>
        <g transform="rotate(45)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(90)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(135)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(180)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(225)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(270)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(315)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
      </g>
    </g>
    <circle cx="0" cy="0" r="26" fill="url(#irisGrad)"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#efece5" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="5" fill="#efece5"/>
  </g>
