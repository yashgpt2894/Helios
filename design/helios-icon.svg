<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a1a1c"/>
      <stop offset="60%" stop-color="#0f0f10"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>

    <linearGradient id="bladeGrad" x1="0" y1="-92" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="55%" stop-color="#dcd6c8"/>
      <stop offset="100%" stop-color="#a59f90"/>
    </linearGradient>

    <radialGradient id="irisGrad" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#1d1d1f"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </radialGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="55%" stop-color="rgba(244,241,234,0.4)"/>
      <stop offset="100%" stop-color="rgba(244,241,234,0)"/>
    </radialGradient>

    <clipPath id="ringClip">
      <circle cx="0" cy="0" r="92"/>
    </clipPath>

    <g id="blade">
      <polygon points="0,-92 78,-46 0,0"/>
    </g>
    <g id="bladeEngraving">
      <line x1="6" y1="-78" x2="62" y2="-44" stroke-width="0.6" stroke-opacity="0.22"/>
      <line x1="12" y1="-66" x2="50" y2="-36" stroke-width="0.6" stroke-opacity="0.16"/>
      <line x1="18" y1="-54" x2="38" y2="-28" stroke-width="0.6" stroke-opacity="0.10"/>
    </g>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <g transform="translate(512 512) scale(3.6)">
    <g stroke="#efece5" stroke-width="0.8" opacity="0.32">
      <line x1="0" y1="-104" x2="0" y2="-99"/>
      <g transform="rotate(30)"><line x1="0" y1="-104" x2="0" y2="-101"/></g>
      <g transform="rotate(60)"><line x1="0" y1="-104" x2="0" y2="-101"/></g>
      <g transform="rotate(90)"><line x1="0" y1="-104" x2="0" y2="-99"/></g>
      <g transform="rotate(120)"><line x1="0" y1="-104" x2="0" y2="-101"/></g>
      <g transform="rotate(150)"><line x1="0" y1="-104" x2="0" y2="-101"/></g>
      <g transform="rotate(180)"><line x1="0" y1="-104" x2="0" y2="-99"/></g>
      <g transform="rotate(210)"><line x1="0" y1="-104" x2="0" y2="-101"/></g>
      <g transform="rotate(240)"><line x1="0" y1="-104" x2="0" y2="-101"/></g>
      <g transform="rotate(270)"><line x1="0" y1="-104" x2="0" y2="-99"/></g>
      <g transform="rotate(300)"><line x1="0" y1="-104" x2="0" y2="-101"/></g>
      <g transform="rotate(330)"><line x1="0" y1="-104" x2="0" y2="-101"/></g>
    </g>

    <circle cx="0" cy="0" r="98" fill="none" stroke="#efece5" stroke-width="0.6" opacity="0.35"/>
    <circle cx="0" cy="0" r="92" fill="none" stroke="#efece5" stroke-width="1.6"/>

    <g clip-path="url(#ringClip)">
      <g fill="url(#bladeGrad)" stroke="#efece5" stroke-width="0.4" stroke-linejoin="miter">
        <use href="#blade"/>
        <g transform="rotate(45)"><use href="#blade"/></g>
        <g transform="rotate(90)"><use href="#blade"/></g>
        <g transform="rotate(135)"><use href="#blade"/></g>
        <g transform="rotate(180)"><use href="#blade"/></g>
        <g transform="rotate(225)"><use href="#blade"/></g>
        <g transform="rotate(270)"><use href="#blade"/></g>
        <g transform="rotate(315)"><use href="#blade"/></g>
      </g>

      <g stroke="#0b0b0c" fill="none">
        <use href="#bladeEngraving"/>
        <g transform="rotate(45)"><use href="#bladeEngraving"/></g>
        <g transform="rotate(90)"><use href="#bladeEngraving"/></g>
        <g transform="rotate(135)"><use href="#bladeEngraving"/></g>
        <g transform="rotate(180)"><use href="#bladeEngraving"/></g>
        <g transform="rotate(225)"><use href="#bladeEngraving"/></g>
        <g transform="rotate(270)"><use href="#bladeEngraving"/></g>
        <g transform="rotate(315)"><use href="#bladeEngraving"/></g>
      </g>

      <g stroke="#0b0b0c" stroke-width="0.7" opacity="0.45">
        <line x1="0" y1="0" x2="0" y2="-92"/>
        <g transform="rotate(45)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(90)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(135)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(180)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(225)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(270)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
        <g transform="rotate(315)"><line x1="0" y1="0" x2="0" y2="-92"/></g>
      </g>
    </g>

    <circle cx="0" cy="0" r="26" fill="url(#irisGrad)"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#efece5" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#efece5" stroke-width="0.4" opacity="0.5"/>

    <circle cx="0" cy="0" r="14" fill="url(#nodeGlow)" opacity="0.35"/>
    <circle cx="0" cy="0" r="5" fill="#efece5"/>
    <circle cx="-1.6" cy="-1.8" r="1.4" fill="#0b0b0c" opacity="0.4"/>
  </g>
</svg>
