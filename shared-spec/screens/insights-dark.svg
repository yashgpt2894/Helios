  <text x="340" y="445" fill="#efece5" font-family="monospace" font-size="12" text-anchor="end">35 <tspan fill="#7a7568" font-size="10">kWh</tspan></text>
  <rect x="35" y="452" width="310" height="3" rx="1.5" fill="#141416"/><rect x="35" y="452" width="300" height="3" rx="1.5" fill="#f0c674"/>
