<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#070708"/><stop offset="100%" stop-color="#0b0b0c"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(26,26,28,0.9)"/><stop offset="100%" stop-color="rgba(15,15,16,0.9)"/></linearGradient>
  </defs>
  <rect width="393" height="852" fill="url(#bg)"/>
  <!-- Header -->
  <text x="20" y="100" fill="#7a7568" font-family="monospace" font-size="10" letter-spacing="0.2em">HELIOS° INTELLIGENCE</text>
  <text x="20" y="130" fill="#efece5" font-family="system-ui" font-size="28" font-weight="500">What we noticed today</text>
  <text x="20" y="155" fill="#7a7568" font-family="system-ui" font-size="13">Insights from 3 strings, inverter, battery, and weather.</text>
  <!-- Insight Highlight -->
  <rect x="20" y="175" width="353" height="120" rx="18" fill="url(#surface)" stroke="rgba(239,236,229,0.06)"/>
