  <text x="35" y="385" fill="#efece5" font-family="system-ui" font-size="12" font-weight="500">Today</text>
  <text x="100" y="385" fill="#7a7568" font-family="monospace" font-size="10">Clear</text>
  <text x="340" y="385" fill="#efece5" font-family="monospace" font-size="12" text-anchor="end">31 <tspan fill="#7a7568" font-size="10">kWh</tspan></text>
  <rect x="35" y="392" width="310" height="3" rx="1.5" fill="#141416"/><rect x="35" y="392" width="280" height="3" rx="1.5" fill="#f0c674"/>
