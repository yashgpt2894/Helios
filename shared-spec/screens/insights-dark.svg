  <text x="340" y="475" fill="#d97757" font-family="monospace" font-size="12" text-anchor="end">22 <tspan fill="#7a7568" font-size="10">kWh</tspan></text>
  <rect x="35" y="482" width="310" height="3" rx="1.5" fill="#141416"/><rect x="35" y="482" width="180" height="3" rx="1.5" fill="#d97757"/>
