  <rect x="203" y="610" width="170" height="100" rx="18" fill="url(#surface)" stroke="rgba(239,236,229,0.06)"/>
  <text x="218" y="635" fill="#7a7568" font-family="monospace" font-size="9" letter-spacing="0.15em">SAVINGS · MONTH</text>
  <text x="218" y="665" fill="#efece5" font-family="Georgia, serif" font-size="24">$112</text>
  <rect x="20" y="725" width="170" height="100" rx="18" fill="url(#surface)" stroke="rgba(239,236,229,0.06)"/>
  <text x="35" y="750" fill="#7a7568" font-family="monospace" font-size="9" letter-spacing="0.15em">LIFETIME</text>
  <text x="35" y="780" fill="#efece5" font-family="Georgia, serif" font-size="24">$4,720</text>
  <rect x="203" y="725" width="170" height="100" rx="18" fill="url(#surface)" stroke="rgba(239,236,229,0.06)"/>
  <text x="218" y="750" fill="#7a7568" font-family="monospace" font-size="9" letter-spacing="0.15em">CO₂ AVOIDED</text>
  <text x="218" y="780" fill="#efece5" font-family="Georgia, serif" font-size="24">7,736</text>
  <text x="218" y="798" fill="#7a7568" font-family="monospace" font-size="9">kg</text>
  <!-- Full feed -->
  <text x="20" y="855" fill="#7a7568" font-family="monospace" font-size="10" letter-spacing="0.2em">FULL FEED · ALL INSIGHTS</text>
  <rect x="20" y="865" width="353" height="90" rx="18" fill="url(#surface)" stroke="rgba(239,236,229,0.06)"/>
  <rect x="35" y="880" width="32" height="32" rx="16" fill="#141416" stroke="rgba(239,236,229,0.12)"/>
  <text x="78" y="898" fill="#efece5" font-family="system-ui" font-size="13" font-weight="500">Self-consumption is excellent</text>
  <text x="78" y="915" fill="#a59f90" font-family="system-ui" font-size="11">74% on-site — well above neighborhood median.</text>
  <text x="340" y="898" fill="#7fb069" font-family="monospace" font-size="10" text-anchor="end">74%</text>
  <!-- Annotation -->
  <line x1="380" y1="235" x2="420" y2="235" stroke="#f0c674" stroke-width="0.5"/>
  <text x="425" y="238" fill="#f0c674" font-family="monospace" font-size="9">Expandable cards with swipe actions</text>
  <text x="425" y="250" fill="#f0c674" font-family="monospace" font-size="9">iOS: custom rotor "Jump to peak"</text>
