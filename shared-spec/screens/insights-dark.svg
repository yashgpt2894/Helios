  <rect x="35" y="215" width="40" height="40" rx="20" fill="#141416" stroke="rgba(239,236,229,0.12)"/>
  <text x="85" y="235" fill="#efece5" font-family="system-ui" font-size="16" font-weight="500">Cloud cover suppressing yield</text>
