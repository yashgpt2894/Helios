  <text x="218" y="305" fill="#7a7568" font-family="monospace" font-size="9" letter-spacing="0.15em">BATTERY</text>
  <text x="218" y="340" fill="#efece5" font-family="Georgia, serif" font-size="32">62</text>
  <text x="218" y="360" fill="#7a7568" font-family="monospace" font-size="9">% state of charge</text>
  <rect x="20" y="400" width="170" height="100" rx="18" fill="url(#surface)" stroke="rgba(239,236,229,0.06)"/>
  <text x="35" y="425" fill="#7a7568" font-family="monospace" font-size="9" letter-spacing="0.15em">SELF-USE</text>
  <text x="35" y="460" fill="#efece5" font-family="Georgia, serif" font-size="32">74</text>
  <text x="35" y="480" fill="#7a7568" font-family="monospace" font-size="9">% on-site</text>
  <rect x="203" y="400" width="170" height="100" rx="18" fill="url(#surface)" stroke="rgba(239,236,229,0.06)"/>
  <text x="218" y="425" fill="#7a7568" font-family="monospace" font-size="9" letter-spacing="0.15em">LIFETIME</text>
  <text x="218" y="460" fill="#efece5" font-family="Georgia, serif" font-size="32">18.4</text>
  <text x="218" y="480" fill="#7a7568" font-family="monospace" font-size="9">MWh · 12 kg CO₂ today</text>
