  <text x="130" y="598" fill="#efece5" font-family="monospace" font-size="12" text-anchor="middle">28</text>
  <rect x="115" y="605" width="30" height="3" rx="1.5" fill="#141416"/><rect x="115" y="605" width="22" height="3" rx="1.5" fill="#f0c674"/>
  <text x="205" y="580" fill="#7a7568" font-family="monospace" font-size="9" text-anchor="middle">Sat</text>
  <text x="205" y="598" fill="#efece5" font-family="monospace" font-size="12" text-anchor="middle">35</text>
  <rect x="190" y="605" width="30" height="3" rx="1.5" fill="#141416"/><rect x="190" y="605" width="28" height="3" rx="1.5" fill="#f0c674"/>
  <text x="280" y="580" fill="#7a7568" font-family="monospace" font-size="9" text-anchor="middle">Sun</text>
  <text x="280" y="598" fill="#efece5" font-family="monospace" font-size="12" text-anchor="middle">22</text>
  <rect x="265" y="605" width="30" height="3" rx="1.5" fill="#141416"/><rect x="265" y="605" width="18" height="3" rx="1.5" fill="#f0c674"/>
  <text x="340" y="580" fill="#7a7568" font-family="monospace" font-size="9" text-anchor="middle">Mon</text>
  <text x="340" y="598" fill="#efece5" font-family="monospace" font-size="12" text-anchor="middle">38</text>
  <rect x="325" y="605" width="30" height="3" rx="1.5" fill="#141416"/><rect x="325" y="605" width="24" height="3" rx="1.5" fill="#f0c674"/>
  <!-- CTA -->
  <rect x="20" y="645" width="353" height="120" rx="18" fill="url(#surface)" stroke="rgba(239,236,229,0.06)"/>
  <text x="35" y="675" fill="#efece5" font-family="system-ui" font-size="16" font-weight="500">Want one for your roof?</text>
  <text x="35" y="698" fill="#a59f90" font-family="system-ui" font-size="12">helios° works with any SunSpec-compatible inverter.</text>
  <rect x="35" y="715" width="140" height="36" rx="18" fill="#efece5"/>
  <text x="105" y="738" fill="#0b0b0c" font-family="system-ui" font-size="12" font-weight="500" text-anchor="middle">Try helios°</text>
  <rect x="190" y="715" width="100" height="36" rx="8" fill="rgba(20,20,22,0.6)" stroke="rgba(239,236,229,0.06)"/>
  <text x="240" y="738" fill="#dcd6c8" font-family="monospace" font-size="11" text-anchor="middle">Copy link</text>
  <!-- Annotation -->
  <line x1="380" y1="215" x2="420" y2="215" stroke="#f0c674" stroke-width="0.5"/>
  <text x="425" y="218" fill="#f0c674" font-family="monospace" font-size="9">Decode SnapshotPayload v1</text>
  <text x="425" y="230" fill="#f0c674" font-family="monospace" font-size="9">Identical base64url algorithm on all platforms</text>
