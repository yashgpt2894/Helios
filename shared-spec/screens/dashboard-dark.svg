<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070708"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(244,198,116,0.06)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(26,26,28,0.9)"/>
      <stop offset="100%" stop-color="rgba(15,15,16,0.9)"/>
    </linearGradient>
    <linearGradient id="prodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c674" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f0c674" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="393" height="852" fill="url(#bg)"/>
  <rect width="393" height="300" fill="url(#aurora)"/>

  <!-- Grid dots -->
