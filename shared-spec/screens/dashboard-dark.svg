  <rect x="20" y="125" width="353" height="420" rx="20" fill="none" stroke="rgba(239,236,229,0.04)" style="box-shadow: inset 0 1px 0 0 rgba(239,236,229,0.04)"/>

  <!-- Live kW -->
  <text x="35" y="165" fill="#7a7568" font-family="monospace" font-size="10" letter-spacing="0.2em">LIVE · 2S AGO</text>
  <text x="35" y="215" fill="#efece5" font-family="Georgia, serif" font-size="56" font-weight="300" letter-spacing="-0.02em">4.23</text>
