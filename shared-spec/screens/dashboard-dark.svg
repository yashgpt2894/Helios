  <text x="280" y="760" fill="#efece5" font-family="monospace" font-size="12" text-anchor="middle">22</text>
  <rect x="265" y="770" width="30" height="3" rx="1.5" fill="#141416"/><rect x="265" y="770" width="18" height="3" rx="1.5" fill="#f0c674"/>

  <text x="340" y="740" fill="#7a7568" font-family="monospace" font-size="9" letter-spacing="0.15em" text-anchor="middle">+4</text>
  <text x="340" y="760" fill="#efece5" font-family="monospace" font-size="12" text-anchor="middle">38</text>
  <rect x="325" y="770" width="30" height="3" rx="1.5" fill="#141416"/><rect x="325" y="770" width="24" height="3" rx="1.5" fill="#f0c674"/>

  <text x="350" y="795" fill="#7fb069" font-family="monospace" font-size="9" text-anchor="end">+13% vs typical</text>

